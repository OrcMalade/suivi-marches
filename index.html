<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Marchés"><meta name="theme-color" content="#0A5CE0"><meta name="format-detection" content="telephone=no"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"></head><body>
<title>Suivi Marchés</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout : application en verre liquide. Un fond ambiant coloré et flou, des panneaux translucides qui le laissent transparaître, une barre d'onglets flottante (en haut sur grand écran, en bas sur téléphone) et des fiches qui glissent par-dessus. Vert et rouge réservés aux hausses et baisses, bleu système pour l'action. */
:root{
  --bg:#E8ECF4; --ink:#0B0D13; --ink-2:#363D4D; --muted:#646D82; --line:rgba(20,28,48,.09); --line-2:rgba(20,28,48,.16);
  --accent:#007AFF; --accent-soft:rgba(0,122,255,.12);
  --gain:#0A7D35; --loss:#C8231B; --warn:#A35400; --info:#0062CC;
  --gain-fill:#1B8C40; --loss-fill:#D42A20; --warn-fill:#E88A00;
  --gain-soft:rgba(27,140,64,.13); --loss-soft:rgba(212,42,32,.12); --warn-soft:rgba(232,138,0,.15); --info-soft:rgba(0,122,255,.12);
  --glass:rgba(255,255,255,.5); --glass-strong:rgba(250,251,255,.78); --glass-thin:rgba(255,255,255,.42); --glass-hover:rgba(255,255,255,.72);
  --rim-hi:rgba(255,255,255,.95); --rim-lo:rgba(255,255,255,.3); --shadow:rgba(28,38,70,.16); --sheen:rgba(255,255,255,.6);
  --blob-1:#86BFFF; --blob-2:#FFB0C8; --blob-3:#9DEBD0; --blob-4:#FFD592; --blob-o:.9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s9:#8C93A3;
  --div-pos:#2a78d6; --div-neg:#e34948;
  --scrim:rgba(14,20,36,.26); --sheet:rgba(246,248,253,.9);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --f-mono:"SF Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --r-xl:28px; --r-l:22px; --r-m:16px; --r-s:11px;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#05070C; --ink:#F3F5FA; --ink-2:#C7CDDA; --muted:#8E97AA; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.18);
  --gain:#30D158; --loss:#FF5A4F; --warn:#FFAA33; --info:#5AB0FF;
  --gain-fill:#22883F; --loss-fill:#D9342A; --warn-fill:#C87700;
  --gain-soft:rgba(48,209,88,.15); --loss-soft:rgba(255,90,79,.15); --warn-soft:rgba(255,170,51,.15); --info-soft:rgba(90,176,255,.16);
  --glass:rgba(28,31,42,.5); --glass-strong:rgba(30,33,44,.8); --glass-thin:rgba(255,255,255,.06); --glass-hover:rgba(255,255,255,.1);
  --rim-hi:rgba(255,255,255,.26); --rim-lo:rgba(255,255,255,.05); --shadow:rgba(0,0,0,.5); --sheen:rgba(255,255,255,.12);
  --blob-1:#1F4FD6; --blob-2:#A3195B; --blob-3:#05795A; --blob-4:#A35A08; --blob-o:.55;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9a2f; --s7:#9085e9; --s8:#e66767; --s9:#7A8294;
  --div-pos:#3987e5; --div-neg:#e66767;
  --scrim:rgba(0,0,0,.5); --sheet:rgba(22,25,34,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#05070C; --ink:#F3F5FA; --ink-2:#C7CDDA; --muted:#8E97AA; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.18);
  --gain:#30D158; --loss:#FF5A4F; --warn:#FFAA33; --info:#5AB0FF;
  --gain-fill:#22883F; --loss-fill:#D9342A; --warn-fill:#C87700;
  --gain-soft:rgba(48,209,88,.15); --loss-soft:rgba(255,90,79,.15); --warn-soft:rgba(255,170,51,.15); --info-soft:rgba(90,176,255,.16);
  --glass:rgba(28,31,42,.5); --glass-strong:rgba(30,33,44,.8); --glass-thin:rgba(255,255,255,.06); --glass-hover:rgba(255,255,255,.1);
  --rim-hi:rgba(255,255,255,.26); --rim-lo:rgba(255,255,255,.05); --shadow:rgba(0,0,0,.5); --sheen:rgba(255,255,255,.12);
  --blob-1:#1F4FD6; --blob-2:#A3195B; --blob-3:#05795A; --blob-4:#A35A08; --blob-o:.55;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9a2f; --s7:#9085e9; --s8:#e66767; --s9:#7A8294;
  --div-pos:#3987e5; --div-neg:#e66767;
  --scrim:rgba(0,0,0,.5); --sheet:rgba(22,25,34,.9); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.locked{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-family:var(--f-display);text-wrap:balance;letter-spacing:-.015em}
h2{font-size:19px;font-weight:700}
h3{font-size:15.5px;font-weight:650}
p{margin:0}
.n{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.up{color:var(--gain)} .down{color:var(--loss)} .flat{color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);max-width:80ch}
.sp{flex:1}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Fond ambiant */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
.ambient i{position:absolute;width:75vmax;height:75vmax;border-radius:50%;opacity:var(--blob-o);will-change:transform}
.ambient i:nth-child(1){left:-28vmax;top:-34vmax;background:radial-gradient(closest-side,var(--blob-1),transparent);animation:d1 44s var(--ease) infinite alternate}
.ambient i:nth-child(2){right:-32vmax;top:-18vmax;background:radial-gradient(closest-side,var(--blob-2),transparent);animation:d2 52s var(--ease) infinite alternate}
.ambient i:nth-child(3){left:-6vmax;bottom:-44vmax;background:radial-gradient(closest-side,var(--blob-3),transparent);animation:d3 48s var(--ease) infinite alternate}
.ambient i:nth-child(4){right:-22vmax;bottom:-38vmax;background:radial-gradient(closest-side,var(--blob-4),transparent);animation:d1 58s var(--ease) infinite alternate-reverse}
@keyframes d1{to{transform:translate(14vmax,10vmax) scale(1.12)}}
@keyframes d2{to{transform:translate(-12vmax,14vmax) scale(.92)}}
@keyframes d3{to{transform:translate(18vmax,-8vmax) scale(1.08)}}

/* Verre */
.glass,.glass-strong{position:relative;isolation:isolate;-webkit-backdrop-filter:blur(26px) saturate(175%);backdrop-filter:blur(26px) saturate(175%);
  box-shadow:inset 0 1px 0 var(--rim-hi),inset 0 -1px 0 var(--rim-lo),0 18px 40px -18px var(--shadow),0 2px 8px -3px var(--shadow)}
.glass{background:var(--glass);border-radius:var(--r-xl)}
.glass-strong{background:var(--glass-strong)}
.glass::before,.glass-strong::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(155deg,var(--rim-hi),var(--rim-lo) 32%,transparent 55%,var(--rim-lo) 78%,var(--rim-hi));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after,.glass-strong::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(520px circle at var(--mx,18%) var(--my,-30%),var(--sheen),transparent 46%)}

.app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 128px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr)}

/* En-tête */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:24px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,#2E9BFF,#0A5CE0 55%,#5B3FD9);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 14px -6px #0A5CE0}
.logo svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;font:700 16px/1.15 var(--f-display);letter-spacing:-.01em}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.live.on{background:#28C76F;animation:pulse 2.2s infinite}
.live.warn{background:var(--warn-fill)}
.live.demo{background:#8E6CF0}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(40,199,111,.55)}70%{box-shadow:0 0 0 7px rgba(40,199,111,0)}100%{box-shadow:0 0 0 0 rgba(40,199,111,0)}}
.top-act{margin-left:auto;display:flex;align-items:center;gap:6px}
.mkt{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--glass-thin);color:var(--muted);white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.mkt.open{color:var(--gain);background:var(--gain-soft);box-shadow:none}
@media (max-width:600px){.mkt{display:none}.top{padding:8px 8px 8px 10px}.logo{width:34px;height:34px}}
@media (max-width:520px){.vh{display:none}}
.an-top{z-index:2}

/* Barre d'onglets flottante */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;border-radius:999px;max-width:calc(100% - 20px)}
.tabbar button{position:relative;z-index:1;border:0;background:none;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:7px 12px 6px;min-width:62px;border-radius:999px;color:var(--muted);font-size:10.5px;font-weight:600;transition:color .25s}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button .ic{width:22px;height:22px}
.tabbar .lens{position:absolute;z-index:0;top:6px;bottom:6px;left:0;border-radius:999px;background:var(--glass-hover);box-shadow:inset 0 1px 0 var(--rim-hi),inset 0 0 0 1px var(--line),0 4px 14px -4px var(--shadow);transition:transform .55s var(--spring),width .55s var(--spring)}
.badge{position:absolute;top:2px;right:12px;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--loss-fill);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--glass-strong)}
@media (min-width:1180px){
  .tabbar{top:calc(env(safe-area-inset-top,0px) + 17px);bottom:auto;padding:4px}
  .tabbar button{display:flex;align-items:center;gap:7px;padding:9px 15px;font-size:13.5px;min-width:0}
  .tabbar button .ic{width:18px;height:18px}
  .tabbar .lens{top:4px;bottom:4px}
  .badge{position:static;margin-left:2px}
  .app{padding-block:12px 48px}
}
.lens.squish{animation:squish .55s var(--ease)}
@keyframes squish{35%{scale:1.16 .84}70%{scale:.97 1.04}}

/* Boutons, segments, puces */
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:999px;font-size:14px;font-weight:600;line-height:1.1;color:var(--ink);background:var(--glass-thin);box-shadow:inset 0 1px 0 var(--rim-hi),inset 0 0 0 1px var(--line);transition:transform .35s var(--spring),background .2s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--glass-hover)}
.btn:active{transform:scale(.95)}
.btn.icon{width:40px;height:40px;padding:0}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.primary{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--loss)}
.btn.danger.armed{background:var(--loss-fill);color:#fff}
.btn.on{color:var(--accent);background:var(--accent-soft)}
.btn[disabled]{opacity:.45;pointer-events:none}
.spin .ic{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{position:relative;display:inline-flex;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none;padding:3px;border-radius:999px;background:var(--glass-thin);box-shadow:inset 0 0 0 1px var(--line)}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;display:inline-flex;align-items:center;gap:5px;border:0;background:none;cursor:pointer;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .lens{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:var(--glass-strong);box-shadow:0 2px 8px -2px var(--shadow),inset 0 1px 0 var(--rim-hi),inset 0 0 0 1px var(--line);transition:transform .5s var(--spring),width .5s var(--spring)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--glass-thin);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.chip.up{background:var(--gain-soft);color:var(--gain);box-shadow:none}
.chip.down{background:var(--loss-soft);color:var(--loss);box-shadow:none}
.chip.warn{background:var(--warn-soft);color:var(--warn);box-shadow:none}
.chip.info{background:var(--info-soft);color:var(--info);box-shadow:none}
.chip .ic{width:13px;height:13px;stroke-width:2.2}
button.chip{cursor:pointer;border:0}
button.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chg{display:inline-block;min-width:74px;padding:5px 8px;border-radius:9px;font-size:13px;font-weight:650;text-align:right;color:#fff;font-variant-numeric:tabular-nums;border:0;cursor:pointer;line-height:1.1}
.chg.up{background:var(--gain-fill)} .chg.down{background:var(--loss-fill)} .chg.flat{background:var(--s9)}
.chg.sm{min-width:62px;padding:3px 6px;font-size:12px;border-radius:7px}

/* Grille et cartes */
.tab{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;animation:tabin .45s var(--ease)}
@keyframes tabin{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c-12{grid-column:span 12}.c-8{grid-column:span 8}.c-7{grid-column:span 7}.c-6{grid-column:span 6}.c-5{grid-column:span 5}.c-4{grid-column:span 4}
@media (max-width:999px){.c-8,.c-7,.c-5,.c-4{grid-column:span 12}.c-6{grid-column:span 6}}
@media (max-width:720px){.c-6{grid-column:span 12}}
.card{padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap}
.card-h > div:first-child{display:grid;gap:2px;min-width:0}
.empty{padding:18px;border-radius:var(--r-m);background:var(--glass-thin);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-size:14px;display:grid;gap:10px;justify-items:start}
.empty b{color:var(--ink)}
.banner{padding:12px 16px;border-radius:var(--r-l);display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner .ic{color:#8E6CF0}

/* Héros */
.hero-num{font:700 clamp(34px,6vw,54px)/1.02 var(--f-display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.hero-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{padding:12px 14px;border-radius:var(--r-m);background:var(--glass-thin);box-shadow:inset 0 1px 0 var(--rim-hi),inset 0 0 0 1px var(--line);display:grid;gap:3px;min-width:0}
.kpi .v{font:650 19px/1.2 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12.5px;color:var(--muted)}

/* Graphiques */
.chart{position:relative;min-width:0;border-radius:12px}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart text{font-family:var(--f-ui);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.ctip{position:absolute;top:0;pointer-events:none;padding:8px 11px;border-radius:13px;font-size:12.5px;display:grid;gap:2px;white-space:nowrap;transform:translateX(-50%);z-index:3}
.ctip b{font-size:15px;font-variant-numeric:tabular-nums}
.ctip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.pick{position:absolute;z-index:4;transform:translate(-50%,-130%)}
.spark{display:block;width:100%;height:34px;overflow:visible}
.vtip{position:fixed;z-index:80;pointer-events:none;padding:7px 10px;border-radius:12px;font-size:12.5px;max-width:260px}
.hint{font-size:12px;color:var(--muted)}

/* Listes */
.rows{display:grid}
.row{display:grid;align-items:center;gap:12px;padding:10px 8px;border-radius:14px;min-width:0;transition:background .2s}
.row + .row{box-shadow:0 -1px 0 var(--line)}
.row.click{cursor:pointer}
.row.click:hover{background:var(--glass-hover);box-shadow:none}
.row.click:hover + .row{box-shadow:none}
.row.head{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:4px 8px}
.row.head button{all:unset;cursor:pointer;display:inline-flex;gap:3px;align-items:center}
.row.head button:focus-visible{outline:2px solid var(--accent)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font:700 11.5px/1 var(--f-ui);letter-spacing:.01em;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 8px -4px var(--shadow);overflow:hidden;text-transform:uppercase}
.av.sm{width:30px;height:30px;border-radius:10px;font-size:10px}
.av.lg{width:54px;height:54px;border-radius:16px;font-size:15px}
.nm{display:grid;gap:1px;min-width:0}
.nm b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r{text-align:right;justify-self:end}
.px{display:grid;gap:3px;justify-items:end;font-variant-numeric:tabular-nums}
.px b{font-weight:650}
.px small{font-size:12px}
.fl-up{animation:flu 1.4s var(--ease)} .fl-down{animation:fld 1.4s var(--ease)}
@keyframes flu{0%{background:var(--gain-soft);box-shadow:0 0 0 4px var(--gain-soft)}100%{background:transparent;box-shadow:0 0 0 4px transparent}}

DIR.forEach(d => { DIRM[d[0]] = {symbol: d[0], name: d[1], currency: d[2], type: d[3], exchange: d[4], base: d[5], mu: d[6], sig: d[7]}; });

const RANGE_DAYS = {'1M': 30.4, '3M': 91.3, '6M': 182.6, '1A': 365.25, '3A': 1095.75, '5A': 1826.25};
function cutRange(pts, r) {
  if (!pts || !pts.length) return pts;

  const lim = r === 'YTD' ? new Date(new Date(lastT).getFullYear(), 0, 1).getTime() - 1 : RANGE_DAYS[r] ? lastT - RANGE_DAYS[r] * DAY : -Infinity;
  const i = pts.findIndex(p => p[0] >= lim); const out = i < 0 ? pts.slice(-2) : pts.slice(i);
  return out.length > 1 ? out : pts.slice(-2);
}

}

function simulate(o) {
  const N = Math.round(o.years * 12), NP = 500, rnd = mulberry(20260);

  for (let p = 0; p < NP; p++) { let v = o.v0; cols[0][p] = v; for (let m = 1; m <= N; m++) { v = v * Math.exp(dm + sm * gauss(rnd)) + o.dca; cols[m][p] = v; } }
  const out = {p10: [], p25: [], p50: [], p75: [], p90: [], contrib: []};
  cols.forEach((c, m) => {
    const d = o.real ? Math.pow(1 + o.infl, -m / 12) : 1; c.sort();
    out.p10.push(c[Math.floor(.1 * (NP - 1))] * d); out.p25.push(c[Math.floor(.25 * (NP - 1))] * d); out.p50.push(c[Math.floor(.5 * (NP - 1))] * d); out.p75.push(c[Math.floor(.75 * (NP - 1))] * d); out.p90.push(c[Math.floor(.9 * (NP - 1))] * d);
    out.contrib.push((o.v0 + o.dca * m) * (o.real ? d : 1));
  });
  const dN = o.real ? Math.pow(1 + o.infl, -N / 12) : 1;
  out.ok = o.goal > 0 ? cols[N].filter(v => v * dN >= o.goal).length / NP : null;
  return out;
}

async function importFile(f) {
  let d; try { d = JSON.parse(await f.text()); } catch (e) { toast('Fichier illisible', 'Ce n\'est pas un fichier JSON valide.'); return; }
  let n = 0;
  if (d.positions || d.lists || d.alerts) { ['settings', 'positions', 'lists', 'alerts', 'notes', 'history'].forEach(k => { if (d[k] != null) { S[k] = d[k]; n++; } }); S = normalize(S); }
  else if (Array.isArray(d.items) && d.items.some(x => 'poche' in x || 'mnemo' in x)) {
    const toBuy = [];
    const pos = d.items.map(x => { if (+x.qty === 0) { toBuy.push(x); return null; } return {id: x.id || uid(), symbol: null, isin: x.isin, mnemo: x.mnemo, name: x.name, env: x.env, poche: x.poche, kind: x.cash ? 'cash' : 'auto', qty: +x.qty || 1, pru: x.cash ? null : +x.pru || null, manualPrice: +x.price || 0, currency: 'EUR'}; }).filter(Boolean);
    toast('Import en cours', 'Recherche des symboles à partir des codes ISIN…');
    const buyRows = toBuy.map(x => ({isin: x.isin, name: x.name, _buy: true}));
    for (const p of pos.concat(buyRows)) {
      if (!p.isin || B.kind === 'demo' || B.kind === 'claude') continue;
      try { const r = await B.search(p.isin); if (r && r[0]) { p.symbol = r[0].symbol; if (!p._buy) { p.qty = +p.qty; p.manualPrice = null; } } } catch (e) {}
    }
    pos.forEach(p => { if (!p.symbol) { p.manualPrice = p.manualPrice * p.qty; p.qty = 1; } });
    S.positions = pos; n++;
    const buys = buyRows.map(x => x.symbol).filter(Boolean);
    if (buys.length) { S.lists.push({id: uid(), name: 'À acheter', symbols: buys}); }
  } else if (d.cible || d.dca != null) {
    const c = {}; Object.keys(d.cible || {}).forEach(k => { c[k] = d.cible[k] <= 1 ? Math.round(d.cible[k] * 1000) / 10 : d.cible[k]; });
    Object.assign(S.settings, {cible: c, dca: d.dca || S.settings.dca}); n++;
  }
  if (!n) { toast('Rien à importer', 'Le fichier ne contient ni positions, ni listes, ni réglages reconnus.'); return; }
  ['settings', 'positions', 'lists', 'alerts', 'notes', 'history'].forEach(save);
  Sheet.close(); toast('Import terminé', 'Tes données ont été chargées.'); refreshQuotes(true); loadDailies(); requestRender();
}

    let n = 0;
    Object.keys(res || {}).forEach(s => { const q = res[s]; if (q && q.price != null && !q.error) { Q[s] = q; META[s] = Object.assign({}, META[s], {name: q.name, currency: q.currency, type: q.type, exchange: q.exchange}); n++; } });
    if (n) { lastOK = Date.now(); lastErr = null; if (B.kind === 'phone') IDB.set('cache-quotes', {at: lastOK, items: Q}); } else if (syms.length && (B.kind === 'local' || B.kind === 'phone')) lastErr = 'vide';
    const fx = tracked().filter(s => !Q[s] && /=X$/.test(s));
    if (fx.length && B.kind !== 'claude') { const r2 = await B.quotes(fx).catch(() => ({})); Object.keys(r2).forEach(s => { if (r2[s] && r2[s].price != null) Q[s] = r2[s]; }); }
  } catch (e) { lastErr = e; }
  busy = false; $('#b-refresh').classList.remove('spin');
  afterQuotes();
}
const FL = {};
function afterQuotes() {
  evaluateAlerts(); recordHistory(); renderAll();
  $$('[data-fl]').forEach(el => { const s = el.dataset.fl, p = Q[s] && Q[s].price; if (!s || p == null) return; if (FL[s] != null && FL[s] !== p && !REDUCED) { el.classList.remove('fl-up', 'fl-down'); void el.offsetWidth; el.classList.add(p > FL[s] ? 'fl-up' : 'fl-down'); } });
  Object.keys(Q).forEach(s => { FL[s] = Q[s].price; });
}
const loading = new Set();
async function loadDailies(list, force) {
  if (!B) return;
  if (B.kind === 'claude') return;
  const ttl = B.kind === 'phone' ? 6 * 36e5 : 30 * 6e4;
  const syms = (list || tracked()).filter(s => !loading.has(s) && (force || !H[s] || Date.now() - H[s].at > ttl));
  syms.forEach(s => loading.add(s));
  let i = 0;
  const worker = async () => { while (i < syms.length) { const s = syms[i++]; try { const d = await B.chart(s, '5y', '1d'); if (d && d.points) { H[s] = Object.assign({}, d, {at: Date.now()}); if (d.name) META[s] = Object.assign({}, META[s], {name: META[s] && META[s].name || d.name, currency: d.currency, type: d.type || (META[s] || {}).type}); } } catch (e) {} loading.delete(s); requestRender(); } };
  await Promise.all([worker(), worker(), worker(), worker()]);
  evaluateAlerts();
}
let loopT = 0;
function schedule() {
  clearInterval(loopT);
  if (!B || B.kind === 'claude') return;
  loopT = setInterval(() => { if (!document.hidden || S.alerts.some(a => a.active)) refreshQuotes(); loadNews(); loadDailies(); }, Math.max(15, +S.settings.refresh || 60) * 1000);
}
setInterval(renderHeader, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && B && B.kind !== 'claude' && Date.now() - lastOK > 20000) refreshQuotes(); });

/* ============================================================ démarrage */
async function boot() {
  applyTheme();
  showTab(TAB, false);
  renderHeader();
  B = await detectBackend();
  try { S = normalize(await B.load()); } catch (e) { S = normalize(null); toast('Données illisibles', 'Le fichier de données n\'a pas pu être lu : l\'application démarre vide.'); }
  if (B.kind === 'phone') {
    try { const c = await IDB.get('cache-quotes'); if (c && c.items) { Object.keys(c.items).forEach(k => { Q[k] = c.items[k]; }); lastOK = c.at; } } catch (e) {}
    try { const ks = await IDB.keys(); await Promise.all(ks.filter(k => String(k).startsWith('cours-')).map(async k => { const d = await IDB.get(k); if (d && d.points) H[d.symbol || String(k).slice(6)] = d; })); } catch (e) {}
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
  if ((B.kind === 'phone' || B.kind === 'demo') && 'serviceWorker' in navigator && window.isSecureContext && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (B.kind === 'claude') {
    B.on(k => {
      if (['settings', 'positions', 'lists', 'alerts', 'notes', 'history'].includes(k)) { const v = B.current(k); if (v !== undefined) { S[k] = v; S = normalize(S); } requestRender(); }
      else if (k === 'quotes') { B.quotes().then(items => { Object.keys(items).forEach(s => { Q[s] = items[s]; META[s] = Object.assign({}, META[s], {name: items[s].name, currency: items[s].currency, type: items[s].type, exchange: items[s].exchange}); }); lastOK = Date.now(); afterQuotes(); }); }
      else if (k === 'news') { B.news().then(n => { NEWS = n; if (TAB === 'home') renderNews(); }); }
      else requestRender();
    });
  }
  renderAll(); showTab(TAB, false);
  await refreshQuotes(true);
  loadDailies().then(() => { if (FICHE && Sheet.isTop(renderFiche)) Sheet.refresh(); });
  loadNews(true);
  schedule();
  if (location.hash && TABS[location.hash.slice(1)]) showTab(location.hash.slice(1));
}
boot();
})();
